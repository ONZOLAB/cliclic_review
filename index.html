<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLICLIC — 체험단</title>
  <style>
    :root {
      --primary: #FF3B00;
      --primary-dark: #CC2E00;
      --primary-light: #FF6633;
      --bg: #111111;
      --card: #1A1A1A;
      --border: #2E2E2E;
      --text: #F0F0F0;
      --text-sub: #AAAAAA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .page {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    /* 상단 로고 바 */
    .top-bar {
      background: var(--primary);
      text-align: center;
      padding: 6px 16px 5px;
      flex-shrink: 0;
    }
    .top-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      line-height: 1.1;
    }
    .top-slogan {
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.5px;
      margin-top: 1px;
    }
    /* 이미지 영역 */
    .img-area {
      flex: 1 1 0;
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
      min-height: 0;
    }
    .img-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.7s ease;
      will-change: opacity;
      transform: translateZ(0);
    }
    /* 메시지 */
    .msg-area {
      flex-shrink: 0;
      text-align: center;
      padding: clamp(8px, 1.8vh, 16px) 20px clamp(4px, 1vh, 10px);
      background: var(--bg);
    }
    .msg-text {
      font-size: 13px;
      color: #CCCCCC;
      line-height: 1.6;
    }
    .msg-sign {
      font-size: 13px;
      color: var(--primary-light);
      font-weight: 600;
      margin-top: 4px;
    }
    /* 네비 버튼 */
    .nav-area {
      flex-shrink: 0;
      padding: clamp(8px, 1.5vh, 14px) 16px clamp(10px, 2vh, 20px);
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.2vh, 10px);
      background: var(--bg);
    }
    .nav-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 1.2vh, 10px);
    }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: clamp(11px, 2vh, 16px) 12px;
      border-radius: 8px;
      font-size: clamp(14px, 1.8vh, 16px);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.18s;
      letter-spacing: 0.3px;
    }
    .nav-btn.primary {
      background: var(--primary);
      color: #fff;
    }
    .nav-btn.primary:hover { background: var(--primary-dark); }
    .nav-btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1.5px solid #444;
    }
    .nav-btn.secondary:hover { border-color: var(--primary); color: var(--primary); }
    .nav-btn.full-width {
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
<div class="page">

  <!-- 로고 바 -->
  <div class="top-bar">
    <div class="top-logo">CLICLIC</div>
    <div class="top-slogan">지구도 사람도 더 건강하게</div>
  </div>

  <!-- 이미지 영역 -->
  <div class="img-area" id="img-area"></div>

  <!-- 메시지 -->
  <div class="msg-area">
    <p class="msg-text">제가 불편해서 만들었고,<br>여러분의 불편함으로 더 좋아집니다.<br>좋았던 것도, 아쉬웠던 것도 모두 솔직하게 남겨주세요.</p>
    <p class="msg-sign">클릭클릭 드림</p>
  </div>

  <!-- 네비게이션 버튼 -->
  <div class="nav-area">
    <div class="nav-row">
      <a href="review-write.html" class="nav-btn primary">✏️ 리뷰 작성하기</a>
      <a href="review-list.html" class="nav-btn primary">💬 리뷰 둘러보기</a>
    </div>
    <div class="nav-row">
      <a href="cleaning.html" class="nav-btn secondary">🧹 세척·사용방법</a>
      <a href="process.html" class="nav-btn secondary">🔧 제작과정</a>
    </div>
    <div class="nav-row">
      <a href="contact.html" class="nav-btn secondary full-width">📬 문의하기</a>
    </div>
  </div>

</div>

<script>
  const images = [
    '1.png','2.png','3.png','4.png','5.png',
    '6.png','7.png','8.png','9.png','10.png',
    '11.png','12.png','13.png','14.png','15.png',
  ];

  (function initImages() {
    const wrap = document.getElementById('img-area');
    const layerA = document.createElement('div');
    const layerB = document.createElement('div');
    layerA.className = 'img-layer';
    layerB.className = 'img-layer';
    layerA.style.opacity = '0';
    layerB.style.opacity = '0';
    wrap.appendChild(layerA);
    wrap.appendChild(layerB);

    let lastIdx = -1;
    let active = layerA;
    let inactive = layerB;

    function showImage(src) {
      const img = new Image();
      img.onload = function() {
        inactive.style.backgroundImage = `url('${src}')`;
        inactive.style.opacity = '1';
        active.style.opacity = '0';
        [active, inactive] = [inactive, active];
      };
      img.src = src;
    }

    function nextImage() {
      let idx;
      do { idx = Math.floor(Math.random() * images.length); } while (idx === lastIdx);
      lastIdx = idx;
      showImage(images[idx]);
    }

    const firstIdx = Math.floor(Math.random() * images.length);
    lastIdx = firstIdx;
    const firstImg = new Image();
    firstImg.onload = function() {
      layerA.style.backgroundImage = `url('${images[firstIdx]}')`;
      layerA.style.opacity = '1';
      active = layerA;
      inactive = layerB;
      setInterval(nextImage, 2000);
    };
    firstImg.src = images[firstIdx];
  })();
</script>
</body>
</html>
